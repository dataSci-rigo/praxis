[project]
name = "praxis"
version = "0.1.0"
description = "Personal practice system for Mindset / Flow / Grit"
requires-python = ">=3.12"
dependencies = [
    "django>=5.1,<5.2",
    "django-environ>=0.11",
    "python-telegram-bot>=21.6",
    "apscheduler>=3.10",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-django>=4.9",
    "ruff>=0.7",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "praxis.settings"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
