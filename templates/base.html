<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Praxis{% endblock %}</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    .quadrant-flow { color: #2a9d8f; }
    .quadrant-anxiety { color: #e76f51; }
    .quadrant-boredom { color: #e9c46a; }
    .quadrant-apathy { color: #8d99ae; }
    .empty-state { opacity: 0.7; font-style: italic; }
    .panel { margin-bottom: 2.5rem; }
    table.compact td, table.compact th { padding: 0.4rem 0.6rem; }
  </style>
</head>
<body>
  <nav class="container">
    <ul>
      <li><strong>Praxis</strong></li>
    </ul>
    <ul>
      <li><a href="{% url 'dashboard' %}">Dashboard</a></li>
      <li><a href="{% url 'insights' %}">Insights</a></li>
      <li><a href="{% url 'goal-tree' %}">Goals</a></li>
      <li><a href="{% url 'session-list' %}">Sessions</a></li>
      <li><a href="{% url 'journal-list' %}">Journal</a></li>
      <li><a href="{% url 'bookcard-list' %}">Library</a></li>
      <li><a href="{% url 'review' %}">Review</a></li>
      <li><a href="{% url 'digest' %}">Digest</a></li>
      <li><a href="{% url 'export-index' %}">Export</a></li>
      <li><a href="/admin/">Admin</a></li>
    </ul>
  </nav>
  <main class="container">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
